# jinfer-hub - AOT exemptions for its own run-time-only classes.
#
# Fetch and Proxies read environment and terminal state at class init, and an HttpClient cannot live
# in the image heap; both must stay run-time-initialized.
Args = --initialize-at-run-time=\
  com.qxotic.jinfer.hub.Fetch,\
  com.qxotic.jinfer.hub.Fetch$Progress,\
  com.qxotic.jinfer.hub.Proxies
