# jinfer-hub - AOT exemptions for its own run-time-only classes.
#
# Fetch and Proxies read environment and terminal state at class init, and an HttpClient cannot live
# in the image heap. TerminalSupport links process-local libc/kernel32 symbols.
Args = -H:+UnlockExperimentalVMOptions \
       -H:+ForeignAPISupport \
       --enable-native-access=ALL-UNNAMED \
       -J--enable-native-access=ALL-UNNAMED \
       --initialize-at-run-time=\
  com.qxotic.jinfer.hub.Fetch,\
  com.qxotic.jinfer.hub.Fetch$Progress,\
  com.qxotic.jinfer.hub.Proxies,\
  com.qxotic.jinfer.hub.TerminalSupport
