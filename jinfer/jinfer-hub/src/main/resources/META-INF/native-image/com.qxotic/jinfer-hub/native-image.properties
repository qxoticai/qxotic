# jinfer-hub — AOT exemptions for its own run-time-only classes.
#
# Fetch and Proxies read JINFER_DOWNLOAD_THREADS and the proxy env/static values at class init, and
# an HttpClient cannot live in the image heap; both must stay run-time-initialized.
Args = --initialize-at-run-time=\
  com.qxotic.jinfer.hub.Fetch,\
  com.qxotic.jinfer.hub.Proxies
