# jinfer-cli - AOT exemptions for its own run-time-only classes.
#
# Terminal links its libc / kernel32 downcalls and reads os.name at class init; folding it would
# freeze the build machine's symbol addresses into the image, and the first isatty would jump there.
Args = --initialize-at-run-time=\
  com.qxotic.jinfer.cli.Terminal
