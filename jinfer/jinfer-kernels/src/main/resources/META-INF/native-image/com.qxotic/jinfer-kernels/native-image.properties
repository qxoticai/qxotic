# jinfer-kernels - AOT exemptions for its own run-time-only classes, plus the inline pins that
# keep a vector from crossing a call in the native image.
#
# MatMul resolves a JAM backend at <clinit>; folding it into the image heap would freeze the build
# machine's backend choice instead of the running host's. FlashAttention and MatMul size per-slot
# scratch by the running host's thread budget at <clinit>. JamPack reads -Djinfer.pack at <clinit> -
# a running-host fact, never a build-machine fact.
#
# The calls a FloatVector crosses are held open by @AlwaysInline on the callee (see MatMul's
# bytesAt/floatsAt/blockFma and KimiDeltaAttention.update, and Convert/Ops which already carried
# it). native-image binds com.oracle.svm.shared.AlwaysInline by name, and jam/graalvm-annotations
# declares it so no GraalVM artifact is needed at compile time.
#
# NOT -H:DirectedInline. That option looks like the equivalent but fails silently twice over: a
# rule whose caller or callee no longer exists is discarded with no build error, and the option is
# single-valued rather than accumulating, so a second module shipping one displaces this module's
# rules entirely. The annotation is on the callee, so it needs no caller name, survives renames,
# and composes across jars. Measured either way on LFM2.5-2.6B-Q8_0 decode: 0.48 t/s unpinned against
# 27.5 t/s pinned; an Oracle GraalVM image inlines these unprompted and measured 27.9 t/s.
#
# The unpinned figure comes from a LOCALLY BUILT, PATCHED GraalVM CE (25.4.4.1.1-dev+1.1, graal at
# 22d016e97a2, the 32-ZMM register work), not a released CE, and a stock CE was not available to
# separate the patch from CE-versus-Oracle. What is certain is that SOME supported builder declines
# these calls, and the annotation costs nothing on the ones that do not - so the pins stay regardless
# of which of the two explanations is right.
#
# This is NOT the HotSpot story. Every JIT jinfer supports inlines these unprompted, so
# hotspot_compile_commands deliberately carries no entry for them - see its header: a kernel that
# is only fast with a hint is a bug in the kernel. The AOT inliner is the one that needs telling.
#
# To re-audit after a kernel changes shape, scan the built image for kernels still on the fallback -
# any com.qxotic symbol it prints is running per-lane:
#   objdump -d jinfer/jinfer | awk '/^[0-9a-f]+ <.*>:$/ { s = $2 } /call.*VectorSupport/ { n[s]++ } END { for (k in n) if (k ~ /qxotic/) print n[k], k }'
Args = --initialize-at-run-time=\
  com.qxotic.jinfer.kernels.MatMul,\
  com.qxotic.jinfer.kernels.FlashAttention,\
  com.qxotic.jinfer.kernels.JamPack
