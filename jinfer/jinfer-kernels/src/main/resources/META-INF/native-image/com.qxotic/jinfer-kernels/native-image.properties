# jinfer-kernels - AOT exemptions for its own run-time-only classes, plus the inline pins that
# keep a vector from crossing a call in the native image.
#
# MatMul resolves a JAM backend at <clinit>; folding it into the image heap would freeze the build
# machine's backend choice instead of the running host's. FlashAttention and MatMul size per-slot
# scratch by the running host's thread budget at <clinit>. JamPack reads -Djinfer.pack at <clinit> -
# a running-host fact, never a build-machine fact.
#
# -H:DirectedInline holds open the calls a FloatVector crosses. GraalVM CE's AOT inliner leaves
# these helpers out-of-line once the calling kernel's body grows past its budget; the returned
# vector then cannot stay in a register, so it is materialized and EVERY Vector API op in the
# caller de-intrinsifies into the generic per-lane path. That is all-or-nothing per method, so it
# is a cliff and not a slope: LFM2.5-2.6B-Q8_0 decode on a GraalVM CE 25 image measures 0.48 t/s
# unpinned against 27.5 t/s pinned. Oracle GraalVM's stronger inliner needs no telling and measures
# 27.9 t/s, which is why the gap shows only on CE.
#
# This is NOT the HotSpot story. Every JIT jinfer supports, CE's included, inlines these unprompted,
# so hotspot_compile_commands deliberately carries no entry for them - see its header: a kernel that
# is only fast with a hint is a bug in the kernel. The AOT inliner is the one that needs telling.
#
# Two ways to break this silently, both covered by InlinePinsTest:
#   - native-image DISCARDS a rule that matches nothing, so renaming a pinned method costs 57x with
#     no build error and no warning.
#   - the option is single-valued rather than accumulating, so if a second module ships one too,
#     the last jar on the image classpath wins and these pins vanish. Keep them in one file.
#
# Pinned only where measured. To re-audit after a kernel changes shape, scan the built image for
# kernels still on the fallback - any com.qxotic symbol it prints is running per-lane:
#   objdump -d jinfer/jinfer | awk '/^[0-9a-f]+ <.*>:$/ { s = $2 } /call.*VectorSupport/ { n[s]++ } END { for (k in n) if (k ~ /qxotic/) print n[k], k }'
Args = -H:+UnlockExperimentalVMOptions \
       -H:DirectedInline=\
  com.qxotic.jinfer.kernels.MatMul.dotQ8_512->com.qxotic.jinfer.kernels.MatMul.bytesAt,\
  com.qxotic.jinfer.kernels.MatMul.dotQ8_512->com.qxotic.jinfer.kernels.MatMul.floatsAt,\
  com.qxotic.jinfer.kernels.KimiDeltaAttention.lambda$scanVector$0->com.qxotic.jinfer.kernels.KimiDeltaAttention.update \
       --initialize-at-run-time=\
  com.qxotic.jinfer.kernels.MatMul,\
  com.qxotic.jinfer.kernels.FlashAttention,\
  com.qxotic.jinfer.kernels.JamPack
