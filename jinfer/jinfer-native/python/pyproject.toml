[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jinfer"
version = "0.4.0rc1"
description = "Local AI inference for Python: chat, vision, audio, embeddings, speech and transcription in one wheel, no server, no ML stack."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Quixotic AI", email = "hello@qxotic.ai" }]
keywords = ["llm", "inference", "chat", "embeddings", "reranking", "speech", "transcription", "gguf", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["toknroll==0.4.0rc1"]   # the toknroll inside libjinfer, exactly: its Python layer is bound to this library (make check-pin)

[project.urls]
Homepage = "https://qxotic.ai"
Documentation = "https://github.com/qxoticai/qxotic/blob/main/jinfer/jinfer-native/python/README.md"
Source = "https://github.com/qxoticai/qxotic"
Issues = "https://github.com/qxoticai/qxotic/issues"

[project.scripts]
jinfer-config = "jinfer._config:main"  # the C world's <name>-config: --cflags, --libs, --pkgconfigdir, --version

[tool.setuptools]
packages = ["jinfer"]  # the library under lib/ is package data, not a package

[tool.setuptools.package-data]
jinfer = ["lib/*/*", "lib/*/pkgconfig/*", "include/*", "py.typed"]  # the library, its pkg-config file and the headers: jinfer-config says where
