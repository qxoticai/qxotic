# chat + embeddings, both in-JVM; ChatClient.Builder comes from the starter
spring.ai.jinfer.chat.model-path=${JINFER_CHAT_MODEL:models/chat.gguf}
spring.ai.jinfer.chat.context-length=4096
spring.ai.jinfer.chat.max-tokens=256

spring.ai.model.embedding=jinfer
spring.ai.jinfer.embedding.model-path=${JINFER_EMBEDDING_MODEL:models/embeddings.gguf}
spring.ai.jinfer.embedding.context-length=2048
