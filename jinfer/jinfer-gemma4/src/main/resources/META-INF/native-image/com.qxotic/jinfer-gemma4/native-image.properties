# jinfer-gemma4 - AOT exemptions for its own run-time-only classes.
#
# VisionPreprocess reads -Djinfer.imageMinTokens / imageMaxTokens at class init; folding it would
# freeze the build machine's budget overrides into the image.
Args = --initialize-at-run-time=\
  com.qxotic.jinfer.models.gemma4.VisionPreprocess
