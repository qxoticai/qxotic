# jinfer-core — the qxotic AOT foundation.
#
# Feature flags jinfer-core itself needs: Segments drives the Vector API (species must be resident
# in the image heap) and reads FFM MemorySegments, so VectorAPISupport / ForeignAPISupport and the
# native-access flags are declared here.
#
# com.qxotic.* is the namespace-level default: qxotic libraries are pure/data libraries, so folding
# them into the image heap is the right default and never references a specific class. Classes that
# CANNOT fold (Cleaners, an HttpClient, FFM downcalls, runtime-flag statics) are opted back out by
# the OWNING module's own native-image.properties — the class-specific knowledge lives next to the
# class, not here.
Args = -H:+UnlockExperimentalVMOptions \
       -H:+VectorAPISupport \
       -H:+ForeignAPISupport \
       --add-modules jdk.incubator.vector \
       --enable-native-access=ALL-UNNAMED \
       -J--enable-native-access=ALL-UNNAMED \
       --initialize-at-build-time=com.qxotic. \
       --initialize-at-run-time=\
  com.qxotic.jinfer.RuntimeFlags,\
  com.qxotic.jinfer.Parallel,\
  com.qxotic.jinfer.Parallel$DecodeSpin,\
  com.qxotic.jinfer.LeakWatch,\
  com.qxotic.jinfer.LeakWatch$Holder,\
  com.qxotic.jinfer.ContextState
