# jinfer-image: every image with this jar on its classpath pins the kernels' Vector API width to the ISA it is
# built for (VectorWidth, which reads the builder's own classes), before any kernel class initializes.
Args = --features=com.qxotic.jinfer.image.VectorWidth \
       -J--add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core=ALL-UNNAMED
