# two ChatModel beans (remote generator + local judge); ChatClients are built manually
spring.ai.chat.client.enabled=false

# the judge: a local GGUF, in-JVM, no server (any chat-capable model)
spring.ai.jinfer.chat.model=${JINFER_JUDGE_MODEL:models/judge.gguf}
spring.ai.jinfer.chat.context-length=8192
spring.ai.jinfer.chat.max-tokens=512

# the generator: Kimi's OpenAI-compatible endpoint (Kimi for Coding key)
spring.ai.openai.base-url=${KIMI_BASE_URL:https://api.kimi.com/coding/v1}
spring.ai.openai.api-key=${KIMI_API_KEY}
spring.ai.openai.chat.options.model=${KIMI_MODEL:kimi-for-coding}
