# jinfer-spring-ai: the Spring adapter belongs to Spring's run time, not to jinfer-core's com.qxotic.
# build-time default: its classes hold Spring objects (a MimeType, a builder), which may not fold into
# the image heap. The prefix covers the auto-configuration package too, whose jar always brings this one.
Args = --initialize-at-run-time=com.qxotic.jinfer.spring
