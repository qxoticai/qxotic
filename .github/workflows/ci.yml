# Pull-request CI, gated: every job targets the `ci` environment, whose required reviewers are the
# maintainers, so nothing runs until one of them approves the run. Pushes never trigger it, and a
# new commit on a PR replaces the pending run rather than adding one. Linux only, no model files,
# no native image, no cross-platform natives. The only downloads are the test fixtures the toknroll
# suites read (7 MB of tiktoken vocabularies, the 100 MB enwik8 corpus), cached across runs.
# One JDK, Oracle GraalVM, two JITs: Graal is what every dev box and the native image run; the
# second leg turns it off (-XX:-UseJVMCICompiler) and is stock HotSpot C2, the path that routes
# kernels differently and that no dev box exercises. The four gates are the four `make ci-*`
# targets, in order; `make ci` is the same sequence locally. The `ci` job at the end is the one
# branch protection requires, so the matrix can grow without touching repository settings.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.jit }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - jit: graal
            flags: ''
          - jit: c2
            flags: -XX:-UseJVMCICompiler
    runs-on: ubuntu-24.04
    environment: ci
    timeout-minutes: 60
    env:
      # Where the toknroll tests and `make test-fixtures` keep the corpus; inside the workspace so
      # the cache step can address it without knowing the OS cache layout.
      TOKNROLL_CACHE_ROOT: ${{ github.workspace }}/.ci-toknroll-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      # What this runner is: the ISA level, the core count and the memory decide which kernels
      # and which test budgets are exercised, so they belong in every log.
      - name: runner facts
        run: |
          echo "jit=${{ matrix.jit }} JAVA_TOOL_OPTIONS=${{ matrix.flags }}"
          lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-400
          free -g | head -2
          java -version
          gcc --version | head -1
          cmake --version | head -1
      # Neither fixture set is in git; `make test-fixtures` (the first step of `make ci`) fills in
      # whatever the cache did not restore, and both scripts verify what they find.
      - uses: actions/cache@v6
        with:
          path: test-fixtures/tiktoken
          key: tiktoken-fixtures-${{ hashFiles('toknroll/scripts/download_tiktoken_fixtures.py') }}
          restore-keys: tiktoken-fixtures-
      - uses: actions/cache@v6
        with:
          path: .ci-toknroll-cache/corpus
          key: enwik8-corpus-${{ hashFiles('toknroll/scripts/download_enwik8.py') }}
          restore-keys: enwik8-corpus-
      - run: make test-fixtures
      - run: make ci-format
      # JAVA_TOOL_OPTIONS reaches every forked test JVM; a -DargLine on the command line does
      # not, because the root pom owns that property for the coverage agent.
      - run: make ci-test
        env:
          JAVA_TOOL_OPTIONS: ${{ matrix.flags }}
      - run: make ci-corpus
        env:
          JAVA_TOOL_OPTIONS: ${{ matrix.flags }}
      # The release step below starts with `clean`; keep the test reports of a failed run.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports-${{ matrix.jit }}
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore
      - run: make ci-release

  ci:
    # The single required status check: green only when every matrix entry is.
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.build.result }}" = "success"
