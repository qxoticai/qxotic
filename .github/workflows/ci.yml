# Pull-request CI, gated: the job targets the `ci` environment, whose required reviewers are the
# maintainers, so nothing runs until one of them approves the run. Pushes never trigger it, and a
# new commit on a PR replaces the pending run rather than adding one. Linux only, no model files,
# no native image, no cross-platform natives. Formatting first, then the default suite, then the
# release shape, each step gating the next; `make ci` is the single source of those steps.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: ci
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The same three steps a developer runs with `make ci`: formatting, the default suite with
      # empty model caches, the release shape without signing or natives.
      - run: make ci
