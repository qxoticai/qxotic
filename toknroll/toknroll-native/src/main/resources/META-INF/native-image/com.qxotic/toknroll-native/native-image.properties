# toknroll-native - the C face runs at run time only: its C strings, handles and the thread-local
# last error are allocated in the running process, never in the image heap.
# WellFormed, which holds nothing but a VarHandle, at build time: a constant handle, which does not box.
# Escape and its handlers at build time too: an entry point's exception handler is uninterruptible, and may
# not initialize a class when it runs.
# LogFinder and the loggers it hands out at build time too: the builder's JDK finds the finder as a service, so a
# logger a build-time-initialized class keeps (libjinfer's) is one of Log's, in the image heap, nothing in it but a name.
# Every image of these entry points (libtoknroll, libjinfer, the profile's training run) pins the vector
# width the target executes before the engine's classes initialize (VectorWidth, which reads the builder's
# own classes), fetches through curl (jinfer-fetch's CurlTransport): the JDK client, and the TLS stack it
# would bring, 18 MB, stay out of the image; and probes the console through the shim (ShimConsole, given to
# the hub at start): the Console service, with the hub's Foreign Function API provider and the method-handle
# machinery it would bring, stays out too.
Args = -H:+UnlockExperimentalVMOptions \
       --initialize-at-run-time=com.qxotic.toknroll.libtoknroll \
       --initialize-at-build-time=com.qxotic.toknroll.libtoknroll.WellFormed,com.qxotic.toknroll.libtoknroll.Escape,com.qxotic.toknroll.libtoknroll.Escape$IntFailure,com.qxotic.toknroll.libtoknroll.Escape$LongFailure,com.qxotic.toknroll.libtoknroll.Escape$HandleFailure,com.qxotic.toknroll.libtoknroll.Escape$StringFailure,com.qxotic.toknroll.libtoknroll.Escape$VoidFailure,com.qxotic.toknroll.libtoknroll.Escape$TaskFailure,com.qxotic.toknroll.libtoknroll.LogFinder,com.qxotic.toknroll.libtoknroll.Log$Logger \
       --features=com.qxotic.toknroll.libtoknroll.VectorWidth \
       -J--add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core=ALL-UNNAMED \
       -H:ServiceLoaderFeatureExcludeServiceProviders=com.qxotic.jinfer.fetch.JdkTransport \
       -H:ServiceLoaderFeatureExcludeServices=com.qxotic.jinfer.hub.Console
