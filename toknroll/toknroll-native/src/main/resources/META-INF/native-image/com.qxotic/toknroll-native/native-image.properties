# toknroll-native - the C face runs at run time only: its C strings, handles and the thread-local
# last error are allocated in the running process, never in the image heap.
# WellFormed, which holds nothing but a VarHandle, at build time: a constant handle, which does not box.
# Every image of these entry points (libtoknroll, libjinfer, the profile's training run) pins the vector
# width the target executes before the engine's classes initialize (VectorWidth, which reads the builder's
# own classes), and fetches through curl (fetch's CurlTransport): the JDK client, and the TLS stack it
# would bring, 18 MB, stay out of the image.
Args = -H:+UnlockExperimentalVMOptions \
       --initialize-at-run-time=com.qxotic.toknroll.libtoknroll \
       --initialize-at-build-time=com.qxotic.toknroll.libtoknroll.WellFormed,com.qxotic.toknroll.libtoknroll.Lean \
       --features=com.qxotic.toknroll.libtoknroll.VectorWidth \
       -J--add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core=ALL-UNNAMED \
       -H:ServiceLoaderFeatureExcludeServiceProviders=com.qxotic.fetch.JdkTransport
