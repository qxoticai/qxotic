# toknroll-vector: native-image build configuration.
#
# The engine fixes its vector species when its classes initialize, so the package initializes at
# build time and the species fold to constants. Their width is the build's toknroll.vector.width,
# else what the BUILD machine prefers: an image for a narrower target sets it to what that target
# executes (libtoknroll's VectorWidth feature does), or every vector op is emulated.
Args = -H:+UnlockExperimentalVMOptions \
       -H:+VectorAPISupport \
       --add-modules jdk.incubator.vector \
       --initialize-at-build-time=com.qxotic.toknroll.vector
