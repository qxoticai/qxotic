# toknroll-vector: native-image build configuration.
#
# The engine fixes its vector species when its classes initialize, so the package initializes at
# build time and the species fold to constants. Their width is toknroll.vector.width, which VectorWidth
# sets, before they initialize, to what the image's target executes: left to what the BUILD machine
# prefers, an image for a narrower target would emulate every vector op. The export lets it read the
# builder's CPU features.
Args = -H:+UnlockExperimentalVMOptions \
       -H:+VectorAPISupport \
       --add-modules jdk.incubator.vector \
       --initialize-at-build-time=com.qxotic.toknroll.vector \
       --features=com.qxotic.toknroll.vector.VectorWidth \
       -J--add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core=ALL-UNNAMED
