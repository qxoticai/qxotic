# jam-native: AOT exemptions for its run-time-only implementation package.
#
# NativeJAM's static init extracts and System.loads libjam, then createPfJni() mints a per-context
# native pointer; NativeLoader reads -Djam.native.* / JAM_NATIVE_* at class init. A native
# library handle and a heap-frozen ctx pointer cannot live in the image heap; the package must stay
# run-time-initialized (mirrors the jni/resources/foreign registrations in
# reachability-metadata.json).
Args = --initialize-at-run-time=com.qxotic.jam.libjam
