# jam-vector: native-image build configuration.
#
# --add-modules puts the Vector API in the image's boot layer, where VectorJAM.isAvailable looks for
# it: without it, an image of jam alone has no vector provider.
# -H:+VectorAPISupport lets GraalVM's Vector-API support build-time-initialize the species classes, so a
# constant F_SPECIES (and ByteVector.SPECIES_128) can be stored in the image heap - no need to
# --initialize-at-build-time the whole jdk.incubator.vector package. -H:+ForeignAPISupport enables the FFM
# memory ops behind the absolute-addressing segment (VectorSupport.GLOBAL = MemorySegment.NULL.reinterpret).
#
# With those on, build-time-initialize jam-vector's implementation package so the species, lane
# counts, tile and band selection, and decode fan-out fold to constants. The vector width is fixed
# at build from jam.vector.width, which VectorWidth sets, before the species initialize, to what the
# image's target executes (-Djam.vector.width / JAM_VECTOR_WIDTH narrow it); the export lets it read
# the builder's CPU features.
#
# No -H:DirectedInline here, deliberately. The calls a vector crosses are held open by
# @AlwaysInline on the callee (the Q4/Q5K/Q6K/BandGemm helpers), or by not making the call at all
# (Nvfp4Kernel's dequantize loop is written out - five vector values crossed that boundary and it
# had two call sites, so the guarantee is cheaper than the request). DirectedInline is single-
# valued rather than accumulating, so a rule here would displace jinfer-kernels' rules whenever
# both jars are on the image classpath, and it discards a rule that matches nothing without a
# warning. The annotation composes; that option does not.
Args = -H:+UnlockExperimentalVMOptions \
       -H:+VectorAPISupport \
       -H:+ForeignAPISupport \
       --add-modules jdk.incubator.vector \
       --initialize-at-build-time=com.qxotic.jam.vector \
       --features=com.qxotic.jam.vector.VectorWidth \
       -J--add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core=ALL-UNNAMED
